name: Gitleaks

# 시크릿 커밋 차단 게이트 (plans/2026-07-07 PR-7).
# docker-compose.yml 평문 자격증명이 이미 히스토리에 들어간 전례의 재발 방지.
# 설정/allowlist: .gitleaks.toml (개인 계정 리포 — GITLEAKS_LICENSE 불필요)
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # PR 커밋 범위 스캔에 전체 히스토리 필요

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
