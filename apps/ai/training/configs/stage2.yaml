# v0.2.0 Stage-2 — 벌 단위 응애 감염 이진 분류기 (ShuffleNet-V2 x1.0, 스펙 §6).
# 스펙 §6 대비 이탈(의도): batch 128→64 (8GB VRAM), '그림자' 증강 미구현 (train_stage2.augment 참조).
# 실행: python tasks.py train-stage2 [--degrade none|90] [--set key=value ...]
# 산출물: <project>/<name>/{best.pt,stage2.onnx,metadata.json,resolved_config.json},
#         training/configs/vdi.yaml, training/eval_history/v0.2.0-stage2.json
epochs: 50
patience: 10
batch: 64          # 스펙 §6 은 128 — RTX 4060 8GB VRAM 여유 때문에 64 (의도적 이탈)
lr: 3.0e-4
weight_decay: 0.01
label_smoothing: 0.05
degrade: none
size_jitter: [0.7, 1.3]   # 학습 전용 크기 지터 (크롭 겉보기 크기 지름길 차단 — shakedown size_only_auroc 0.82~0.85)
img_size: 224      # 모델 입력(정사각). 320 실험(E2)은 make_crops --crop-size 320 크롭과 함께 --set img_size=320
backbone: shufflenet_v2_x1_0   # shufflenet_v2_x1_0 (v2, featmap 1024ch) | resnet18 (E3, 512ch)
select_metric: val_auroc       # val_auroc (v2: 71667+VarroaDataset val) | cal_a_auroc (E1: 71667 cal-A 만). cal-B 는 선택에 절대 안 씀
seed: 42
crops: training/crops
project: training/runs/stage2
name: v0.2.0-stage2
workers: 0        # Windows 학습 박스: DataLoader 워커 0 (spawn 피클 불가). Linux 는 4 권장
