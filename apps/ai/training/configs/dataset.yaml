path: ../datasets/varroa-v1
train: images/train
val: images/val
test: images/test  # 선택. golden은 별도 dataset.yaml로 평가

# v0.2.0 Stage-1: 성충 1-class detection (`--mapping adult1`)
#   0: bee — 성충_정상 / 성충_응애 / 성충_날개불구 (71667 cat 4·5·6). 유충 제외.
#   응애 판정은 Stage-2 분류기 몫 — 검출기는 벌만 찾는다.
#
# 매핑 단일 소스: aihub_to_yolo.py 의 CLASS_MAPPINGS["adult1"].
# v0.1.0 3-class(bee_normal / bee_with_varroa / bee_other_disease)는 CLASS_MAPPINGS["legacy3"].
names:
  0: bee
nc: 1
